// Types the Compose compiler cannot judge for itself.
//
// Stability is worked out by the Compose compiler plugin as it compiles a
// module, so a class from a module compiled without it -- which is every type
// in :core-ftp, a plain Kotlin library on purpose -- is assumed unstable. An
// unstable parameter means a composable can never be skipped, so every row on
// screen recomposed whenever anything anywhere in the pane changed, and the
// file list scrolled badly for it.
//
// Both of these are immutable data classes of primitives and Strings. Saying
// so here is a statement about code that is already true, not a promise being
// made about code that might change: if a `var` ever appears in one of them,
// this line becomes a lie and the list starts showing stale rows.
org.filezilla.ftp.listing.DirectoryEntry
org.filezilla.ftp.listing.EntryTime
