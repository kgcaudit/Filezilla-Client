# AndroidX is required by every dependency the app uses.
android.useAndroidX=true

# The Android build is memory-hungry; the default 512m heap makes AGP's
# resource and dexing tasks fail on a small container.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.caching=true
org.gradle.parallel=true

# Only the build types the app actually ships are configured, so AGP's
# per-flavour resource pipeline does not run for combinations that do not
# exist.
android.nonTransitiveRClass=true
